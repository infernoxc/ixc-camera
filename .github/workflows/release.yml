name: Release

# Builds, tests, audits and packages IXC Camera on a clean Windows runner, then publishes a
# GitHub release v<version> with the installer and checksums (the same files
# scripts/package-release.ps1 produces on a developer PC).
#
# Start it from Actions → Release → "Run workflow" on main, or by pushing a tag v<version>.
# The version comes from CMakeLists.txt (generated version.h); a pushed tag must match it.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      # Actions are pinned to full commit SHAs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build and test (release)
        shell: pwsh
        run: ./scripts/build.ps1 -Preset release -Test

      - name: Release audit
        shell: pwsh
        run: ./scripts/audit-release.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $version = ((Get-Content build\release\generated\ixc\version.h) -match 'IXC_VERSION_STRING' -replace '.*"(.*)".*', '$1') | Select-Object -First 1
          if (-not $version) { throw 'version.h not found' }
          $tag = "v$version"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) { throw "Tag $env:REF_NAME doesn't match the build version $version." }
          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump the version in CMakeLists.txt for a new release." }
          $files = Get-ChildItem "dist\IXC-Camera-$version" -File | ForEach-Object FullName
          $notes = "docs\release-notes-$version.md"
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create $tag @files --repo $env:REPO --target $env:SHA --title "IXC Camera $version" @notesArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          "Published $tag"
